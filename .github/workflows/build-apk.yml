name: Build Android APK - Darbat Mouallim

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/zaytouna/darbatmouallim
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/assets

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DarbatMouallim"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zaytouna.darbatmouallim'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zaytouna.darbatmouallim"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ضربة معلم</string>
          </resources>
          EOF

          # 7. Launcher Icon
          cat << 'EOF' > app/src/main/res/mipmap-hdpi/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF6F00"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#D50000"
                  android:pathData="M54,54m-42,0a42,42 0,1 1,84 0a42,42 0,1 1,-84 0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,54m-30,0a30,30 0,1 1,60 0a30,30 0,1 1,-60 0"/>
              <path
                  android:fillColor="#D50000"
                  android:pathData="M54,54m-18,0a18,18 0,1 1,36 0a18,18 0,1 1,-36 0"/>
              <path
                  android:fillColor="#FFD600"
                  android:pathData="M54,54m-8,0a8,8 0,1 1,16 0a8,8 0,1 1,-16 0"/>
          </vector>
          EOF

          # 8. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/zaytouna/darbatmouallim/MainActivity.java
          package com.zaytouna.darbatmouallim;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setSupportZoom(false);

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate HTML5 Game Assets
        run: |
          cat << 'HTMLEOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>ضربة معلم - لعبة الألغاز والتصويب</title>
            <style>
              :root {
                --primary-orange: #FF6F00;
                --sunset-top: #FF5722;
                --sunset-mid: #FF8F00;
                --sunset-bot: #FFA000;
                --gold-light: #FFF176;
                --gold-main: #FFC107;
                --gold-dark: #FF8F00;
                --sky-blue: #00B0FF;
                --blue-dark: #0277BD;
                --lime-green: #76FF03;
                --green-dark: #2E7D32;
                --crimson-red: #FF1744;
                --text-dark: #37474F;
                --text-light: #FFFFFF;
              }

              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
              }

              body {
                font-family: 'Segoe UI', 'Cairo', 'Tajawal', Tahoma, sans-serif;
                background: linear-gradient(175deg, var(--sunset-top) 0%, var(--sunset-mid) 40%, var(--sunset-bot) 75%, #FFB300 100%);
                color: var(--text-dark);
                min-height: 100vh;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
              }

              #app-container {
                width: 100vw;
                height: 100vh;
                max-width: 480px;
                max-height: 920px;
                position: relative;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                background: radial-gradient(circle at 50% 15%, rgba(255,255,255,0.22) 0%, transparent 60%),
                            linear-gradient(180deg, #FF6F00 0%, #FF8F00 45%, #FFA000 85%, #FFB300 100%);
                box-shadow: 0 0 40px rgba(0,0,0,0.5);
              }

              #confetti-canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 999;
              }

              .screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: none;
                flex-direction: column;
                z-index: 10;
              }
              .screen.active {
                display: flex;
              }

              .glossy-btn {
                position: relative;
                border: 3px solid rgba(255,255,255,0.8);
                border-radius: 24px;
                font-weight: 800;
                cursor: pointer;
                text-align: center;
                text-shadow: 0 2px 3px rgba(0,0,0,0.35);
                color: var(--text-light);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.08s ease, box-shadow 0.08s ease;
              }
              .glossy-btn:active {
                transform: translateY(4px) !important;
                box-shadow: 0 2px 0 rgba(0,0,0,0.3) !important;
              }
              .glossy-btn::before {
                content: '';
                position: absolute;
                top: 2px;
                left: 10%;
                right: 10%;
                height: 40%;
                background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.05) 100%);
                border-radius: 16px 16px 100px 100px;
                pointer-events: none;
              }

              .btn-green {
                background: linear-gradient(180deg, #76FF03 0%, #43A047 100%);
                box-shadow: 0 6px 0 #1B5E20, 0 10px 20px rgba(0,0,0,0.35);
              }
              .btn-orange {
                background: linear-gradient(180deg, #FFB300 0%, #E65100 100%);
                box-shadow: 0 6px 0 #BF360C, 0 10px 20px rgba(0,0,0,0.35);
              }
              .btn-blue {
                background: linear-gradient(180deg, #40C4FF 0%, #0277BD 100%);
                box-shadow: 0 6px 0 #01579B, 0 10px 20px rgba(0,0,0,0.35);
              }
              .btn-purple {
                background: linear-gradient(180deg, #E040FB 0%, #7B1FA2 100%);
                box-shadow: 0 6px 0 #4A148C, 0 10px 20px rgba(0,0,0,0.35);
              }

              .gold-badge {
                display: flex;
                align-items: center;
                gap: 6px;
                background: linear-gradient(180deg, #FFF9C4 0%, #FFE082 30%, #FFB300 100%);
                border: 3px solid #FFF8E1;
                box-shadow: 0 4px 0 #B78103, 0 6px 12px rgba(0,0,0,0.25);
                border-radius: 30px;
                padding: 6px 16px;
                color: #5D4037;
                font-weight: 900;
                font-size: 1.05rem;
                cursor: pointer;
              }

              .circle-btn {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
                border: 3px solid #FFF8E1;
                background: linear-gradient(180deg, #FFE082 0%, #FFA000 100%);
                box-shadow: 0 5px 0 #B78103, 0 6px 12px rgba(0,0,0,0.25);
                color: #4E342E;
                cursor: pointer;
                transition: transform 0.08s ease;
              }
              .circle-btn:active {
                transform: translateY(3px);
                box-shadow: 0 2px 0 #B78103;
              }

              #splash-screen {
                justify-content: center;
                align-items: center;
                background: radial-gradient(circle at center, #FFA000 0%, #E65100 100%);
                text-align: center;
                padding: 24px;
              }
              .splash-logo-card {
                background: rgba(255,255,255,0.18);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 4px solid rgba(255,255,255,0.5);
                border-radius: 36px;
                padding: 32px 24px;
                box-shadow: inset 0 3px 6px rgba(255,255,255,0.6), 0 16px 36px rgba(0,0,0,0.35);
                width: 85%;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              .studio-pill {
                background: #4E342E;
                color: #FFE082;
                padding: 6px 18px;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: 700;
                letter-spacing: 0.5px;
                margin-bottom: 20px;
                box-shadow: 0 3px 6px rgba(0,0,0,0.3);
              }
              .bullseye-logo {
                width: 140px;
                height: 140px;
                margin-bottom: 16px;
                animation: pulse-ring 2.2s infinite ease-in-out;
              }
              @keyframes pulse-ring {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255,215,0,0.6)); }
                50% { transform: scale(1.08); filter: drop-shadow(0 0 24px rgba(255,215,0,0.9)); }
              }
              .game-main-title {
                font-size: 2.5rem;
                font-weight: 900;
                color: #FFF9C4;
                text-shadow: 0 4px 0 #E65100, 0 8px 16px rgba(0,0,0,0.5);
                margin-bottom: 6px;
              }
              .game-subtitle {
                color: #FFFFFF;
                font-size: 1.05rem;
                font-weight: 700;
                text-shadow: 0 2px 4px rgba(0,0,0,0.4);
                margin-bottom: 24px;
              }
              .splash-start-btn {
                width: 100%;
                padding: 16px 0;
                font-size: 1.4rem;
              }

              #menu-screen {
                padding: 18px;
                justify-content: space-between;
              }
              .top-header-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                z-index: 20;
              }
              .menu-hero-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                margin: auto 0;
              }
              .hero-badge-art {
                width: 130px;
                height: 130px;
                position: relative;
              }
              .play-giant-btn {
                width: 240px;
                height: 72px;
                font-size: 1.6rem;
                border-radius: 36px;
                animation: bounce-subtle 2s infinite ease-in-out;
              }
              @keyframes bounce-subtle {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-6px); }
              }
              .menu-sub-actions {
                display: flex;
                gap: 12px;
                width: 100%;
                max-width: 320px;
              }
              .sub-btn {
                flex: 1;
                padding: 12px 6px;
                font-size: 0.95rem;
                border-radius: 20px;
              }
              .menu-footer {
                display: flex;
                justify-content: center;
                gap: 16px;
                padding-top: 10px;
              }

              #game-screen {
                display: none;
                flex-direction: column;
                padding: 12px 14px;
                height: 100%;
              }
              .game-top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
              }
              .stage-pill {
                background: linear-gradient(180deg, #40C4FF 0%, #0288D1 100%);
                color: white;
                border: 3px solid #E1F5FE;
                box-shadow: 0 4px 0 #01579B, 0 6px 12px rgba(0,0,0,0.25);
                border-radius: 24px;
                padding: 6px 18px;
                font-weight: 900;
                font-size: 1.1rem;
                text-shadow: 0 2px 3px rgba(0,0,0,0.3);
              }
              
              .question-ribbon-card {
                position: relative;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFF8E1 100%);
                border: 3.5px solid #FFE082;
                border-radius: 20px;
                padding: 12px 16px;
                margin-bottom: 10px;
                box-shadow: inset 0 2px 4px rgba(255,255,255,0.9), 0 6px 0 #FFA000, 0 10px 18px rgba(0,0,0,0.25);
                text-align: center;
              }
              .category-tag {
                display: inline-block;
                background: #FF6F00;
                color: #FFFFFF;
                font-size: 0.75rem;
                font-weight: 800;
                padding: 3px 12px;
                border-radius: 12px;
                margin-bottom: 4px;
              }
              .question-text {
                font-size: 1.25rem;
                font-weight: 900;
                color: #3E2723;
                line-height: 1.35;
              }
              .trick-clickable {
                color: #D84315;
                text-decoration: underline;
                cursor: pointer;
              }

              .canvas-arena {
                flex: 1;
                position: relative;
                background: #FFFFFF;
                border-radius: 24px;
                border: 4px solid #FFE082;
                box-shadow: inset 0 4px 8px rgba(0,0,0,0.1), 0 8px 0 #FFA000, 0 14px 24px rgba(0,0,0,0.3);
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: none;
                user-select: none;
              }
              #stage-svg {
                width: 100%;
                height: 100%;
                display: block;
                cursor: crosshair;
              }

              .target-pin {
                position: absolute;
                width: 52px;
                height: 52px;
                pointer-events: none;
                transform: translate(-50%, -50%) scale(0);
                transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                z-index: 50;
              }
              .target-pin.dropped {
                transform: translate(-50%, -50%) scale(1);
              }

              .radar-hint-circle {
                position: absolute;
                border: 4px dashed #FFD600;
                background: rgba(255, 235, 59, 0.25);
                border-radius: 50%;
                pointer-events: none;
                transform: translate(-50%, -50%);
                animation: radar-pulse 1.2s infinite ease-out;
                z-index: 40;
                display: none;
              }
              @keyframes radar-pulse {
                0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.3; }
              }

              #feedback-toast {
                position: absolute;
                top: 20px;
                left: 50%;
                transform: translateX(-50%) translateY(-30px);
                opacity: 0;
                background: #D50000;
                color: white;
                font-weight: 900;
                font-size: 1.1rem;
                padding: 8px 24px;
                border-radius: 20px;
                border: 3px solid #FF8A80;
                box-shadow: 0 6px 16px rgba(0,0,0,0.4);
                pointer-events: none;
                z-index: 80;
                transition: transform 0.25s ease, opacity 0.25s ease;
                white-space: nowrap;
              }
              #feedback-toast.show {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
              }

              .game-bottom-bar {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                margin-top: 10px;
              }
              .help-btn {
                flex: 1;
                padding: 10px 4px;
                font-size: 0.95rem;
                border-radius: 18px;
                display: flex;
                flex-direction: column;
                gap: 2px;
              }
              .help-btn small {
                font-size: 0.72rem;
                opacity: 0.9;
              }

              .modal-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.65);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 100;
                padding: 16px;
              }
              .modal-overlay.active {
                display: flex;
              }
              .clay-modal {
                width: 100%;
                max-width: 380px;
                background: linear-gradient(180deg, #FFFDE7 0%, #FFF8E1 100%);
                border: 4px solid #FFE082;
                border-radius: 32px;
                padding: 24px 20px;
                box-shadow: inset 0 3px 6px rgba(255,255,255,0.8), 0 16px 36px rgba(0,0,0,0.45);
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                position: relative;
              }
              .modal-close-icon {
                position: absolute;
                top: 12px;
                left: 14px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #FF5252;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 900;
                font-size: 1.1rem;
                cursor: pointer;
                border: 2px solid white;
                box-shadow: 0 3px 6px rgba(0,0,0,0.3);
              }
              .modal-title {
                font-size: 1.6rem;
                font-weight: 900;
                color: #E65100;
                margin-bottom: 12px;
              }

              .victory-stars-box {
                display: flex;
                gap: 12px;
                margin: 14px 0;
              }
              .star-icon {
                font-size: 2.8rem;
                filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
                transform: scale(0);
                transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
              }
              .star-icon.filled {
                color: #FFD600;
                transform: scale(1);
              }
              .star-icon.empty {
                color: #BDBDBD;
                transform: scale(0.9);
              }
              .victory-eval-text {
                font-size: 1.4rem;
                font-weight: 900;
                color: #2E7D32;
                margin-bottom: 6px;
              }
              .victory-reward-badge {
                background: linear-gradient(180deg, #FFE082 0%, #FFA000 100%);
                padding: 8px 24px;
                border-radius: 20px;
                font-weight: 900;
                font-size: 1.15rem;
                color: #4E342E;
                margin-bottom: 20px;
                border: 2px solid white;
              }

              .stages-scroll-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
                width: 100%;
                max-height: 340px;
                overflow-y: auto;
                padding: 10px 4px;
                margin: 10px 0;
              }
              .stage-node-btn {
                aspect-ratio: 1/1;
                border-radius: 20px;
                border: 3px solid white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-weight: 900;
                font-size: 1.15rem;
                cursor: pointer;
                position: relative;
                box-shadow: 0 5px 0 rgba(0,0,0,0.2);
              }
              .stage-node-btn.completed {
                background: linear-gradient(180deg, #76FF03 0%, #43A047 100%);
                color: white;
              }
              .stage-node-btn.current {
                background: linear-gradient(180deg, #FFB300 0%, #E65100 100%);
                color: white;
                animation: pulse-ring 2s infinite ease-in-out;
              }
              .stage-node-btn.locked {
                background: #B0BEC5;
                color: #ECEFF1;
                cursor: not-allowed;
                box-shadow: 0 4px 0 #78909C;
              }
              .stage-node-stars {
                font-size: 0.65rem;
                margin-top: 2px;
              }

              .settings-row {
                display: flex;
                justify-content: space-between;
