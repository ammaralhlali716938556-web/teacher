              clue: "إصابة عين الهدف الدقيقة تتطلب ثبات اليد والتركيز بنسبة 100%!",
              target: { x: 300, y: 240, r: 25 },
              triviaTitle: "أصل تسمية ضربة معلّم",
              triviaFact: "يرجع أصل مصطلح 'ضربة معلّم' إلى ورش الحرفيين والصناع التقليديين العرب؛ حيث كان شيخ الصنعة أو 'المعلّم' يتدخل في اللحظة الحرجة ليقوم باللمسة الحاسمة التي تتطلب خبرة السنين وتحوّل القطعة الخام إلى تحفة فنية لا تقدر بثمن.",
              svg: `
                <rect width="600" height="500" fill="#212121"/>
