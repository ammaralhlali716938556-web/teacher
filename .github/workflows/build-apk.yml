          <script>
          const AudioEngine = {
            ctx: null,
            enabled: true,

            init() {
              if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
              }
              if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
              }
            },

            playWoodClick() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(320, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.06);
              gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.06);
            },

            playPinDrop() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(450, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.09);
              gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.09);
            },

            playBullseyeFanfare() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const notes = [523.25, 659.25, 783.99, 1046.50, 1318.5];
              notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + idx * 0.08);
                osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
              });
            },

            playCoinSound() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
              osc.frequency.setValueAtTime(1318.5, this.ctx.currentTime + 0.07);
              gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.25);
            },

            playError() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(160, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.18);
              gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.18);
            },

            playHint() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, this.ctx.currentTime);
