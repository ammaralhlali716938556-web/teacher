name: Build Android APK - Darbat Mouallim

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/zaytouna/darbatmouallim
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/assets

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }}
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }}
          rootProject.name = "DarbatMouallim"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zaytouna.darbatmouallim'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zaytouna.darbatmouallim"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ضربة معلم</string>
          </resources>
          EOF

          # 7. Launcher Icon
          cat << 'EOF' > app/src/main/res/mipmap-hdpi/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF6F00"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#D50000"
                  android:pathData="M54,54m-42,0a42,42 0,1 1,84 0a42,42 0,1 1,-84 0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,54m-30,0a30,30 0,1 1,60 0a30,30 0,1 1,-60 0"/>
              <path
                  android:fillColor="#D50000"
                  android:pathData="M54,54m-18,0a18,18 0,1 1,36 0a18,18 0,1 1,-36 0"/>
              <path
                  android:fillColor="#FFD600"
                  android:pathData="M54,54m-8,0a8,8 0,1 1,16 0a8,8 0,1 1,-16 0"/>
          </vector>
          EOF

          # 8. MainActivity.java (With Intelligent Back Navigation Bridge)
          cat << 'EOF' > app/src/main/java/com/zaytouna/darbatmouallim/MainActivity.java
          package com.zaytouna.darbatmouallim;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setSupportZoom(false);

                  webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void promptExit() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              showExitDialog();
                          }
                      });
                  }
              }

              private void showExitDialog() {
                  new AlertDialog.Builder(MainActivity.this)
                      .setTitle("مغادرة اللعبة")
                      .setMessage("هل تود حقاً الخروج من لعبة ضربة معلّم؟")
                      .setPositiveButton("خروج", new DialogInterface.OnClickListener() {
                          public void onClick(DialogInterface dialog, int which) {
                              finish();
                          }
                      })
                      .setNegativeButton("متابعة اللعب", null)
                      .show();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null) {
                      webView.evaluateJavascript("window.handleAndroidBack ? window.handleAndroidBack() : 'exit';", new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String value) {
                              if ("\"exit\"".equals(value) || "\"unhandled\"".equals(value)) {
                                  showExitDialog();
                              }
                          }
                      });
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Generate HTML5 Game Assets
        run: |
          cat << 'HTMLEOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>ضربة معلم - لعبة الألغاز والتصويب والمعلومات</title>
            <style>
              :root {
                --primary-orange: #FF6F00;
                --sunset-top: #FF5722;
                --sunset-mid: #FF8F00;
                --sunset-bot: #FFA000;
                --gold-light: #FFF176;
                --gold-main: #FFC107;
                --gold-dark: #FF8F00;
                --sky-blue: #00B0FF;
                --blue-dark: #0277BD;
                --lime-green: #76FF03;
                --green-dark: #2E7D32;
                --crimson-red: #FF1744;
                --text-dark: #37474F;
                --text-light: #FFFFFF;
              }

              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
              }

              body {
                font-family: 'Segoe UI', 'Cairo', 'Tajawal', Tahoma, sans-serif;
                background: linear-gradient(175deg, var(--sunset-top) 0%, var(--sunset-mid) 40%, var(--sunset-bot) 75%, #FFB300 100%);
                color: var(--text-dark);
                min-height: 100vh;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
              }

              #app-container {
                width: 100vw;
                height: 100vh;
                max-width: 480px;
                max-height: 920px;
                position: relative;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                background: radial-gradient(circle at 50% 15%, rgba(255,255,255,0.22) 0%, transparent 60%),
                            linear-gradient(180deg, #FF6F00 0%, #FF8F00 45%, #FFA000 85%, #FFB300 100%);
                box-shadow: 0 0 40px rgba(0,0,0,0.5);
              }

              #confetti-canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 999;
              }

              .screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: none;
                flex-direction: column;
                z-index: 10;
              }
              .screen.active {
                display: flex;
              }

              .glossy-btn {
                position: relative;
                border: 3px solid rgba(255,255,255,0.85);
                border-radius: 24px;
                font-weight: 800;
                cursor: pointer;
                text-align: center;
                text-shadow: 0 2px 3px rgba(0,0,0,0.35);
                color: var(--text-light);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.08s ease, box-shadow 0.08s ease;
              }
              .glossy-btn:active {
                transform: translateY(4px) !important;
                box-shadow: 0 2px 0 rgba(0,0,0,0.3) !important;
              }
              .glossy-btn::before {
                content: '';
                position: absolute;
                top: 2px;
                left: 10%;
                right: 10%;
                height: 40%;
                background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.05) 100%);
                border-radius: 16px 16px 100px 100px;
                pointer-events: none;
              }

              .btn-green {
                background: linear-gradient(180deg, #76FF03 0%, #43A047 100%);
                box-shadow: 0 6px 0 #1B5E20, 0 10px 20px rgba(0,0,0,0.35);
              }
              .btn-orange {
                background: linear-gradient(180deg, #FFB300 0%, #E65100 100%);
                box-shadow: 0 6px 0 #BF360C, 0 10px 20px rgba(0,0,0,0.35);
              }
              .btn-blue {
                background: linear-gradient(180deg, #40C4FF 0%, #0277BD 100%);
                box-shadow: 0 6px 0 #01579B, 0 10px 20px rgba(0,0,0,0.35);
              }
              .btn-purple {
                background: linear-gradient(180deg, #E040FB 0%, #7B1FA2 100%);
                box-shadow: 0 6px 0 #4A148C, 0 10px 20px rgba(0,0,0,0.35);
              }

              .gold-badge {
                display: flex;
                align-items: center;
                gap: 6px;
                background: linear-gradient(180deg, #FFF9C4 0%, #FFE082 30%, #FFB300 100%);
                border: 3px solid #FFF8E1;
                box-shadow: 0 4px 0 #B78103, 0 6px 12px rgba(0,0,0,0.25);
                border-radius: 30px;
                padding: 6px 16px;
                color: #5D4037;
                font-weight: 900;
                font-size: 1.05rem;
                cursor: pointer;
              }

              .circle-btn {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.25rem;
                border: 3px solid #FFF8E1;
                background: linear-gradient(180deg, #FFE082 0%, #FFA000 100%);
                box-shadow: 0 5px 0 #B78103, 0 6px 12px rgba(0,0,0,0.25);
                color: #4E342E;
                cursor: pointer;
                transition: transform 0.08s ease;
              }
              .circle-btn:active {
                transform: translateY(3px);
                box-shadow: 0 2px 0 #B78103;
              }

              #splash-screen {
                justify-content: center;
                align-items: center;
                background: radial-gradient(circle at center, #FFA000 0%, #E65100 100%);
                text-align: center;
                padding: 24px;
              }
              .splash-logo-card {
                background: rgba(255,255,255,0.18);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 4px solid rgba(255,255,255,0.5);
                border-radius: 36px;
                padding: 32px 24px;
                box-shadow: inset 0 3px 6px rgba(255,255,255,0.6), 0 16px 36px rgba(0,0,0,0.35);
                width: 88%;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              .studio-pill {
                background: #4E342E;
                color: #FFE082;
                padding: 6px 18px;
                border-radius: 20px;
                font-size: 0.85rem;
                font-weight: 700;
                letter-spacing: 0.5px;
                margin-bottom: 20px;
                box-shadow: 0 3px 6px rgba(0,0,0,0.3);
              }
              .bullseye-logo {
                width: 140px;
                height: 140px;
                margin-bottom: 16px;
                animation: pulse-ring 2.2s infinite ease-in-out;
              }
              @keyframes pulse-ring {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255,215,0,0.6)); }
                50% { transform: scale(1.08); filter: drop-shadow(0 0 24px rgba(255,215,0,0.9)); }
              }
              .game-main-title {
                font-size: 2.5rem;
                font-weight: 900;
                color: #FFF9C4;
                text-shadow: 0 4px 0 #E65100, 0 8px 16px rgba(0,0,0,0.5);
                margin-bottom: 6px;
              }
              .game-subtitle {
                color: #FFFFFF;
                font-size: 1.05rem;
                font-weight: 700;
                text-shadow: 0 2px 4px rgba(0,0,0,0.4);
                margin-bottom: 24px;
              }
              .splash-start-btn {
                width: 100%;
                padding: 16px 0;
                font-size: 1.4rem;
              }

              #menu-screen {
                padding: 18px;
                justify-content: space-between;
              }
              .top-header-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                z-index: 20;
              }
              .menu-hero-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                margin: auto 0;
              }
              .hero-badge-art {
                width: 130px;
                height: 130px;
                position: relative;
              }
              .play-giant-btn {
                width: 250px;
                height: 72px;
                font-size: 1.6rem;
                border-radius: 36px;
                animation: bounce-subtle 2s infinite ease-in-out;
              }
              @keyframes bounce-subtle {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-6px); }
              }
              .menu-sub-actions {
                display: flex;
                gap: 12px;
                width: 100%;
                max-width: 330px;
              }
              .sub-btn {
                flex: 1;
                padding: 12px 6px;
                font-size: 0.95rem;
                border-radius: 20px;
              }
              .menu-footer {
                display: flex;
                justify-content: center;
                gap: 16px;
                padding-top: 10px;
              }

              #map-screen {
                background: linear-gradient(180deg, #E65100 0%, #FF8F00 30%, #FFA000 70%, #FFB300 100%);
              }
              .map-header {
                padding: 12px 14px 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(0,0,0,0.15);
                border-bottom: 2px solid rgba(255,255,255,0.2);
                z-index: 30;
              }
              .map-progress-pill {
                background: linear-gradient(180deg, #FFFFFF 0%, #FFF9C4 100%);
                border: 2px solid #FFE082;
                border-radius: 20px;
                padding: 4px 14px;
                font-size: 0.85rem;
                font-weight: 800;
                color: #E65100;
                box-shadow: 0 3px 6px rgba(0,0,0,0.2);
              }
              .map-scroll-area {
                flex: 1;
                overflow-y: auto;
                overflow-x: hidden;
                position: relative;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 90px;
              }
              .map-scroll-area::-webkit-scrollbar {
                width: 6px;
              }
              .map-scroll-area::-webkit-scrollbar-thumb {
                background: rgba(255,255,255,0.4);
                border-radius: 10px;
              }
              .map-content-wrapper {
                position: relative;
                width: 100%;
                min-height: 1950px;
              }
              .map-road-svg {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 1;
              }
              .map-zone-banner {
                position: absolute;
                left: 5%;
                width: 90%;
                background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,249,196,0.92) 100%);
                border: 2.5px solid #FFD54F;
                border-radius: 16px;
                padding: 8px 14px;
                font-size: 0.95rem;
                font-weight: 900;
                color: #D84315;
                text-align: center;
                box-shadow: 0 6px 14px rgba(0,0,0,0.25);
                z-index: 2;
              }
              .map-node {
                position: absolute;
                width: 64px;
                height: 64px;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border: 3.5px solid white;
                font-weight: 900;
                font-size: 1.25rem;
                color: white;
                cursor: pointer;
                z-index: 10;
                box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 16px rgba(0,0,0,0.3);
                transition: transform 0.15s ease;
              }
              .map-node:active {
                transform: translate(-50%, -46%) scale(0.96);
              }
              .map-node.completed {
                background: linear-gradient(180deg, #76FF03 0%, #43A047 100%);
                border-color: #E8F5E9;
              }
              .map-node.current {
                background: linear-gradient(180deg, #FFB300 0%, #E65100 100%);
                border-color: #FFF9C4;
                animation: pulse-ring 2s infinite ease-in-out;
              }
              .map-node.locked {
                background: #78909C;
                border-color: #CFD8DC;
                color: #ECEFF1;
                cursor: not-allowed;
                box-shadow: 0 5px 0 #455A64;
              }
              .map-node-stars {
                position: absolute;
                bottom: -18px;
                font-size: 0.7rem;
                white-space: nowrap;
                filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
              }
              .map-current-pin {
                position: absolute;
                top: -34px;
                background: #D50000;
                color: white;
                font-size: 0.72rem;
                font-weight: 800;
                padding: 2px 8px;
                border-radius: 12px;
                border: 1.5px solid white;
                box-shadow: 0 3px 6px rgba(0,0,0,0.35);
                animation: float-tag 1.5s infinite ease-in-out;
                white-space: nowrap;
              }
              @keyframes float-tag {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-4px); }
              }
              .map-bottom-bar {
                position: absolute;
                bottom: 12px;
                left: 14px;
                right: 14px;
                z-index: 30;
                display: flex;
                justify-content: center;
              }

              #game-screen {
                display: none;
                flex-direction: column;
                padding: 10px 14px;
                height: 100%;
              }
              .game-top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
              }
              .stage-pill {
                background: linear-gradient(180deg, #40C4FF 0%, #0288D1 100%);
                color: white;
                border: 3px solid #E1F5FE;
                box-shadow: 0 4px 0 #01579B, 0 6px 12px rgba(0,0,0,0.25);
                border-radius: 24px;
                padding: 5px 16px;
                font-weight: 900;
                font-size: 1.05rem;
                text-shadow: 0 2px 3px rgba(0,0,0,0.3);
              }
              
              .question-ribbon-card {
                position: relative;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFF8E1 100%);
                border: 3px solid #FFE082;
                border-radius: 20px;
                padding: 10px 14px;
                margin-bottom: 8px;
                box-shadow: inset 0 2px 4px rgba(255,255,255,0.9), 0 5px 0 #FFA000, 0 10px 18px rgba(0,0,0,0.25);
                text-align: center;
              }
              .category-tag {
                display: inline-block;
                background: #FF6F00;
                color: #FFFFFF;
                font-size: 0.75rem;
                font-weight: 800;
                padding: 2px 10px;
                border-radius: 12px;
                margin-bottom: 4px;
              }
              .question-text {
                font-size: 1.18rem;
                font-weight: 900;
                color: #3E2723;
                line-height: 1.35;
                margin-bottom: 4px;
              }
              .question-clue {
                font-size: 0.8rem;
                font-weight: 700;
                color: #795548;
                opacity: 0.95;
              }
              .trick-clickable {
                color: #D84315;
                text-decoration: underline;
                cursor: pointer;
              }

              .canvas-arena {
                flex: 1;
                position: relative;
                background: #FFFFFF;
                border-radius: 22px;
                border: 4px solid #FFE082;
                box-shadow: inset 0 4px 8px rgba(0,0,0,0.1), 0 8px 0 #FFA000, 0 14px 24px rgba(0,0,0,0.3);
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: none;
                user-select: none;
              }
              #stage-svg {
                width: 100%;
                height: 100%;
                display: block;
                cursor: crosshair;
              }

              .target-pin {
                position: absolute;
                width: 52px;
                height: 52px;
                pointer-events: none;
                transform: translate(-50%, -50%) scale(0);
                transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                z-index: 50;
              }
              .target-pin.dropped {
                transform: translate(-50%, -50%) scale(1);
              }

              .radar-hint-circle {
                position: absolute;
                border: 4px dashed #FFD600;
                background: rgba(255, 235, 59, 0.25);
