            },
            {
              id: 11,
              title: "أين القفل المفتوح الوحيد بين هذه الأقفال؟",
              category: "قوة ملاحظة",
              target: { x: 380, y: 260, r: 35 },
              svg: `
                <rect width="600" height="500" fill="#FFF3E0"/>
                <g id="locks-grid"></g>
                <text x="300" y="455" font-size="15" font-weight="bold" fill="#E65100" text-anchor="middle">جميع الأقفال محكمة الإغلاق ما عدا قفل وحيد!</text>
              `
            },
            {
              id: 12,
              title: "حدد مركز عين الهدف الذهبي (ضربة معلّم الختامية)",
              category: "التحدي الأسطوري",
              target: { x: 300, y: 240, r: 25 },
              svg: `
                <rect width="600" height="500" fill="#212121"/>
                <circle cx="300" cy="240" r="180" fill="#37474F" stroke="#FFE082" stroke-width="8"/>
                <circle cx="300" cy="240" r="140" fill="#0288D1"/>
                <circle cx="300" cy="240" r="100" fill="#D50000"/>
                <circle cx="300" cy="240" r="60" fill="#FFFFFF"/>
                <circle cx="300" cy="240" r="25" fill="#FFD600" stroke="#FFF" stroke-width="4"/>
                <line x1="300" y1="50" x2="300" y2="430" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                <line x1="110" y1="240" x2="490" y2="240" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                <text x="300" y="460" font-size="18" font-weight="bold" fill="#FFD600" text-anchor="middle">أثبت مهارتك وأصب نقطة الصفر بدقة 100%!</text>
              `
            }
          ];

          const Game = {
            currentStageIdx: 0,
            coins: 250,
            stageProgress: {},
            vibrationEnabled: true,

            init() {
              this.loadState();
              Confetti.init();
              this.updateCoinsUI();
              this.bindArenaTouch();
            },

            loadState() {
              try {
                const savedCoins = localStorage.getItem('dm_coins');
                if (savedCoins !== null) this.coins = parseInt(savedCoins, 10);
                const savedProgress = localStorage.getItem('dm_progress');
                if (savedProgress) this.stageProgress = JSON.parse(savedProgress);
                const savedStage = localStorage.getItem('dm_current_stage');
                if (savedStage !== null) this.currentStageIdx = parseInt(savedStage, 10);
                const savedSound = localStorage.getItem('dm_sound');
                if (savedSound !== null) {
                  AudioEngine.enabled = savedSound === 'true';
                  document.getElementById('setting-sound').checked = AudioEngine.enabled;
                }
                const savedVib = localStorage.getItem('dm_vibration');
                if (savedVib !== null) {
                  this.vibrationEnabled = savedVib === 'true';
                  document.getElementById('setting-vibrate').checked = this.vibrationEnabled;
                }
              } catch (e) {}
            },

            saveState() {
              try {
                localStorage.setItem('dm_coins', this.coins);
                localStorage.setItem('dm_progress', JSON.stringify(this.stageProgress));
                localStorage.setItem('dm_current_stage', this.currentStageIdx);
                localStorage.setItem('dm_sound', AudioEngine.enabled);
                localStorage.setItem('dm_vibration', this.vibrationEnabled);
              } catch (e) {}
            },

            vibrate(ms) {
              if (this.vibrationEnabled && navigator.vibrate) {
                navigator.vibrate(ms);
              }
            },

            showScreen(screenId) {
              document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
              const target = document.getElementById(screenId);
              if (target) target.classList.add('active');
            },

            startGameFromSplash() {
              AudioEngine.playWoodClick();
              this.showScreen('menu-screen');
            },

            goToMenu() {
              AudioEngine.playWoodClick();
              this.updateCoinsUI();
              const btn = document.getElementById('main-play-btn');
              if (btn) btn.innerHTML = `الـعـب (مرحلة ${this.currentStageIdx + 1}) 🎯`;
              this.showScreen('menu-screen');
            },

            playCurrentStage() {
              AudioEngine.playWoodClick();
              this.loadStage(this.currentStageIdx);
              this.showScreen('game-screen');
            },

            loadStage(idx) {
              if (idx >= STAGES.length) {
                this.openModal('finale-modal');
                return;
              }
              this.currentStageIdx = idx;
              this.saveState();
              const stage = STAGES[idx];

              document.getElementById('game-stage-title').innerText = `مرحلة ${stage.id}`;
              document.getElementById('game-category-tag').innerText = stage.category;

              const qEl = document.getElementById('game-question-text');
              if (stage.id === 5) {
                qEl.innerHTML = `أين تقع <span id="trick-word" class="trick-clickable" onclick="Game.onTrickClick(event)">'الكعبة المشرفة'</span>؟`;
              } else {
                qEl.innerText = stage.title;
              }

              const svgEl = document.getElementById('stage-svg');
              svgEl.innerHTML = stage.svg;

              if (stage.id === 4) this.renderFacesGrid();
              if (stage.id === 11) this.renderLocksGrid();

              const pin = document.getElementById('target-pin');
              pin.classList.remove('dropped');
              document.getElementById('radar-hint').style.display = 'none';

              this.updateCoinsUI();
            },

            renderFacesGrid() {
              const parent = document.getElementById('faces-grid');
              if (!parent) return;
              let markup = '';
              for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 5; c++) {
                  const cx = 100 + c * 100;
                  const cy = 110 + r * 90;
                  const isSmiling = (r === 2 && c === 3);
                  if (isSmiling) {
                    markup += `
                      <circle cx="${cx}" cy="${cy}" r="32" fill="#FFEB3B" stroke="#F57F17" stroke-width="3"/>
                      <circle cx="${cx - 10}" cy="${cy - 8}" r="4" fill="#212121"/>
                      <circle cx="${cx + 10}" cy="${cy - 8}" r="4" fill="#212121"/>
                      <path d="M ${cx - 16} ${cy + 4} Q ${cx} ${cy + 24}, ${cx + 16} ${cy + 4}" stroke="#D84315" stroke-width="4" fill="none" stroke-linecap="round"/>
                    `;
                  } else {
                    markup += `
                      <circle cx="${cx}" cy="${cy}" r="32" fill="#FFD54F" stroke="#FFA000" stroke-width="2"/>
                      <circle cx="${cx - 10}" cy="${cy - 6}" r="3.5" fill="#212121"/>
                      <circle cx="${cx + 10}" cy="${cy - 6}" r="3.5" fill="#212121"/>
                      <path d="M ${cx - 14} ${cy + 14} Q ${cx} ${cy + 2}, ${cx + 14} ${cy + 14}" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>
                    `;
                  }
                }
              }
              parent.innerHTML = markup;
            },

            renderLocksGrid() {
              const parent = document.getElementById('locks-grid');
              if (!parent) return;
              let markup = '';
              for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                  const cx = 120 + c * 120;
                  const cy = 130 + r * 105;
                  const isOpen = (r === 1 && c === 2);
                  if (isOpen) {
                    markup += `
                      <g transform="translate(${cx - 25}, ${cy - 30})">
                        <path d="M 12 12 Q 12 -18, 35 -18 Q 48 -18, 48 -6" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
                        <rect x="0" y="10" width="50" height="42" rx="8" fill="#FFC107" stroke="#FFA000" stroke-width="3"/>
                        <circle cx="25" cy="28" r="4" fill="#37474F"/>
                      </g>
                    `;
                  } else {
                    markup += `
                      <g transform="translate(${cx - 25}, ${cy - 20})">
                        <path d="M 10 10 Q 25 -15, 40 10" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
                        <rect x="0" y="8" width="50" height="42" rx="8" fill="#FFB300" stroke="#FF8F00" stroke-width="3"/>
                        <circle cx="25" cy="26" r="4" fill="#37474F"/>
                      </g>
                    `;
                  }
                }
              }
              parent.innerHTML = markup;
            },

            bindArenaTouch() {
              const arena = document.getElementById('canvas-arena');

              const handlePointer = (e) => {
                e.preventDefault();
                const rect = arena.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const px = clientX - rect.left;
                const py = clientY - rect.top;

                const svgX = (px / rect.width) * 600;
                const svgY = (py / rect.height) * 500;

                const pin = document.getElementById('target-pin');
                pin.style.left = px + 'px';
                pin.style.top = py + 'px';
                pin.classList.remove('dropped');
                void pin.offsetWidth;
                pin.classList.add('dropped');

                AudioEngine.playPinDrop();
                this.evaluateTarget(svgX, svgY, clientX, clientY);
              };

              arena.addEventListener('click', handlePointer);
              arena.addEventListener('touchstart', handlePointer, { passive: false });
            },

            onTrickClick(e) {
              e.stopPropagation();
              AudioEngine.playBullseyeFanfare();
              this.vibrate([100, 50, 100]);
              Confetti.burst(window.innerWidth / 2, 100);
              this.showEvaluationModal(100, "عبقرية خارج الصندوق! 🎯", 3);
            },

            evaluateTarget(x, y, scrX, scrY) {
              const stage = STAGES[this.currentStageIdx];
              const target = stage.target;
              const dist = Math.hypot(x - target.x, y - target.y);

              if (dist <= target.r * 0.5) {
                AudioEngine.playBullseyeFanfare();
                this.vibrate([80, 50, 120]);
                Confetti.burst(scrX, scrY);
                this.showToast("🎯 ضربة معلّم! 100%", "#2E7D32");
                setTimeout(() => this.showEvaluationModal(100, "🎯 ضربة معلّم! إصابة في الصميم!", 3), 700);
              }
              else if (dist <= target.r * 1.0) {
                AudioEngine.playBullseyeFanfare();
                this.vibrate(60);
                Confetti.burst(scrX, scrY);
                this.showToast("⭐ ممتاز! قريب جداً من المركز", "#1565C0");
                setTimeout(() => this.showEvaluationModal(80, "⭐ ممتاز جداً! أداء رائع!", 2), 700);
              }
              else if (dist <= target.r * 1.5) {
                AudioEngine.playCoinSound();
                this.vibrate(40);
                this.showToast("👍 جيد! إصابة مقبولة", "#F57F17");
                setTimeout(() => this.showEvaluationModal(50, "👍 جيد! نجحت في اجتياز المرحلة", 1), 700);
              }
              else {
                AudioEngine.playError();
                this.vibrate(30);
                const arena = document.getElementById('canvas-arena');
                arena.classList.remove('shake');
                void arena.offsetWidth;
                arena.classList.add('shake');

                let tip = "❌ بارد! حاول مجدداً";
                if (dist < target.r * 2.5) tip = "🔥 دافئ! أنت قريب، دقق أكثر!";
                this.showToast(tip, "#D50000");
              }
            },

            showToast(text, color) {
              const toast = document.getElementById('feedback-toast');
              toast.innerText = text;
              toast.style.background = color || '#D50000';
              toast.classList.add('show');
              clearTimeout(this._toastTimer);
              this._toastTimer = setTimeout(() => {
                toast.classList.remove('show');
              }, 1200);
            },

            showEvaluationModal(score, title, stars) {
              const stage = STAGES[this.currentStageIdx];
              let earnedCoins = (stars === 3) ? 50 : (stars === 2) ? 30 : 15;
              this.coins += earnedCoins;
              this.stageProgress[stage.id] = { stars, score };
              this.saveState();
              this.updateCoinsUI();

              document.getElementById('victory-eval').innerText = title;
              document.getElementById('victory-reward-text').innerText = `كسبت +${earnedCoins} 💰`;

              for (let s = 1; s <= 3; s++) {
                const el = document.getElementById(`star-${s}`);
                el.className = 'star-icon';
                setTimeout(() => {
                  el.className = `star-icon ${s <= stars ? 'filled' : 'empty'}`;
                }, s * 160);
              }

              this.openModal('victory-modal');
            },

            nextStage() {
              AudioEngine.playWoodClick();
              this.closeModal('victory-modal');
              if (this.currentStageIdx + 1 < STAGES.length) {
                this.loadStage(this.currentStageIdx + 1);
              } else {
                this.openModal('finale-modal');
              }
            },

            useHint() {
              if (this.coins < 25) {
                this.showToast("⚠️ ليس لديك ذهب كافٍ! (يلزم 25)", "#C62828");
                AudioEngine.playError();
                return;
              }
              this.coins -= 25;
              this.saveState();
              this.updateCoinsUI();
              AudioEngine.playHint();

              const stage = STAGES[this.currentStageIdx];
              const target = stage.target;
              const arena = document.getElementById('canvas-arena');
              const rect = arena.getBoundingClientRect();

              const hintEl = document.getElementById('radar-hint');
              const px = (target.x / 600) * rect.width;
              const py = (target.y / 500) * rect.height;

              hintEl.style.left = px + 'px';
              hintEl.style.top = py + 'px';
              hintEl.style.width = '90px';
              hintEl.style.height = '90px';
              hintEl.style.display = 'block';

              this.showToast("💡 تم تضييق دائرة البحث!", "#FF8F00");
            },

            askFriend() {
              AudioEngine.playWoodClick();
              const stage = STAGES[this.currentStageIdx];
              const challengeText = `🎯 ساعدني في حل هذا اللغز في لعبة "ضربة معلم"!\nالمرحلة ${stage.id}: ${stage.title}\nهل يمكنك إصابة الهدف؟`;

              if (navigator.share) {
                navigator.share({
                  title: 'لعبة ضربة معلم',
                  text: challengeText
                }).catch(() => {});
              } else {
                navigator.clipboard?.writeText(challengeText);
                this.showToast("📋 تم نسخ نص السؤال لمشاركته مع أصدقائك!", "#0277BD");
              }
            },

            skipStage() {
              if (this.coins < 50) {
                this.showToast("⚠️ يلزم 50 ذهبة للتخطي!", "#C62828");
                AudioEngine.playError();
                return;
              }
              this.coins -= 50;
              this.saveState();
              this.updateCoinsUI();
              AudioEngine.playWoodClick();
              this.showToast("⏩ تم تخطي المرحلة!", "#6A1B9A");
              setTimeout(() => {
                this.nextStage();
              }, 600);
            },

            claimDailyGift() {
              AudioEngine.playBullseyeFanfare();
              Confetti.burst();
              this.coins += 100;
              this.saveState();
              this.updateCoinsUI();
              this.showToast("🎁 مبروك! كسبت 100 ذهبة مجانية!", "#2E7D32");
            },

            watchAdReward() {
              AudioEngine.playCoinSound();
              Confetti.burst();
              this.coins += 50;
              this.saveState();
              this.updateCoinsUI();
              this.closeModal('coins-modal');
              this.showToast("🎬 شكراً لدعمك! +50 ذهبة", "#2E7D32");
            },

            shareGame() {
              AudioEngine.playCoinSound();
              this.coins += 100;
              this.saveState();
              this.updateCoinsUI();
              this.showToast("🌟 شكراً لمشاركتك! +100 ذهبة", "#2E7D32");
              if (navigator.share) {
                navigator.share({
                  title: 'ضربة معلم',
                  text: 'العب لعبة الألغاز العربية المميزة "ضربة معلم"!'
                }).catch(() => {});
              }
            },

            updateCoinsUI() {
              const el1 = document.getElementById('menu-coins-val');
              const el2 = document.getElementById('game-coins-val');
              if (el1) el1.innerText = this.coins;
              if (el2) el2.innerText = this.coins;
            },

            openMapModal() {
              AudioEngine.playWoodClick();
              const grid = document.getElementById('stages-grid-container');
              grid.innerHTML = '';

              STAGES.forEach((stg, i) => {
                const prog = this.stageProgress[stg.id];
                const isCompleted = !!prog;
                const isCurrent = (i === this.currentStageIdx);
                const isLocked = (!isCompleted && i > this.currentStageIdx);

                const div = document.createElement('div');
                div.className = `stage-node-btn ${isCompleted ? 'completed' : isCurrent ? 'current' : 'locked'}`;
                
                let starsText = isCompleted ? '⭐'.repeat(prog.stars) : isLocked ? '🔒' : '🎯';
                div.innerHTML = `<span>${stg.id}</span><span class="stage-node-stars">${starsText}</span>`;

                if (!isLocked) {
                  div.onclick = () => {
                    AudioEngine.playWoodClick();
                    Game.closeModal('map-modal');
                    Game.loadStage(i);
                    Game.showScreen('game-screen');
                  };
                }
                grid.appendChild(div);
              });

              this.openModal('map-modal');
            },

            openSettingsModal() {
              AudioEngine.playWoodClick();
              this.openModal('settings-modal');
            },

            openCoinsModal() {
              AudioEngine.playWoodClick();
              this.openModal('coins-modal');
            },

            openModal(id) {
              const m = document.getElementById(id);
              if (m) m.classList.add('active');
            },

            closeModal(id) {
              AudioEngine.playWoodClick();
              const m = document.getElementById(id);
              if (m) m.classList.remove('active');
            },

            toggleSound(val) {
              AudioEngine.enabled = val;
              this.saveState();
            },

            toggleVibration(val) {
              this.vibrationEnabled = val;
              this.saveState();
            },

            resetGame() {
              if (confirm("هل تريد بالتأكيد إعادة تصفير تقدمك بالكامل في اللعبة؟")) {
                localStorage.clear();
                this.currentStageIdx = 0;
                this.coins = 250;
                this.stageProgress = {};
                this.saveState();
                location.reload();
              }
            }
          };

          window.addEventListener('DOMContentLoaded', () => {
            Game.init();
          });
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Download & Setup Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip
          chmod +x gradle-8.5/bin/gradle
          ./gradle-8.5/bin/gradle -v

      - name: Build Android APK (assembleDebug)
        run: |
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found!" && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darbat-Mouallim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
