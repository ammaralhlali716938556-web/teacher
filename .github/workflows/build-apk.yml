          ];

          const Game = {
            currentStageIdx: 0,
            coins: 250,
            stageProgress: {},
            selectedPreviewIdx: 0,
            vibrationEnabled: true,

            init() {
              this.loadState();
              Confetti.init();
              this.updateCoinsUI();
              this.bindArenaTouch();
              this.generateMapVisuals();
            },

            loadState() {
              try {
                const savedCoins = localStorage.getItem('dm_coins');
                if (savedCoins !== null) this.coins = parseInt(savedCoins, 10);
                const savedProgress = localStorage.getItem('dm_progress');
                if (savedProgress) this.stageProgress = JSON.parse(savedProgress);
                const savedStage = localStorage.getItem('dm_current_stage');
                if (savedStage !== null) this.currentStageIdx = parseInt(savedStage, 10);
                const savedSound = localStorage.getItem('dm_sound');
                if (savedSound !== null) {
                  AudioEngine.enabled = savedSound === 'true';
                  document.getElementById('setting-sound').checked = AudioEngine.enabled;
                }
                const savedVib = localStorage.getItem('dm_vibration');
                if (savedVib !== null) {
                  this.vibrationEnabled = savedVib === 'true';
                  document.getElementById('setting-vibrate').checked = this.vibrationEnabled;
                }
              } catch (e) {}
            },

            saveState() {
              try {
                localStorage.setItem('dm_coins', this.coins);
                localStorage.setItem('dm_progress', JSON.stringify(this.stageProgress));
                localStorage.setItem('dm_current_stage', this.currentStageIdx);
                localStorage.setItem('dm_sound', AudioEngine.enabled);
                localStorage.setItem('dm_vibration', this.vibrationEnabled);
              } catch (e) {}
            },

            vibrate(ms) {
              if (this.vibrationEnabled && navigator.vibrate) {
                navigator.vibrate(ms);
              }
            },

            showScreen(screenId) {
              document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
              const target = document.getElementById(screenId);
              if (target) target.classList.add('active');
            },

            startGameFromSplash() {
              AudioEngine.playWoodClick();
              this.goToMenu();
            },

            goToMenu() {
              AudioEngine.playWoodClick();
              this.updateCoinsUI();
              const quickNum = document.getElementById('quick-stage-num');
              if (quickNum) quickNum.innerText = Math.min(this.currentStageIdx + 1, STAGES.length);
              this.showScreen('menu-screen');
            },

            openMapScreen() {
              AudioEngine.playWoodClick();
              this.renderMapNodes();
              this.updateCoinsUI();
              const btnNum = document.getElementById('map-btn-stage-num');
              if (btnNum) btnNum.innerText = Math.min(this.currentStageIdx + 1, STAGES.length);
              this.showScreen('map-screen');

              setTimeout(() => {
                const activeNode = document.querySelector('.map-node.current');
                if (activeNode) {
                  activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
              }, 200);
            },

            playCurrentStageDirectly() {
              AudioEngine.playWoodClick();
              this.loadStage(this.currentStageIdx);
              this.showScreen('game-screen');
            },

            generateMapVisuals() {
              this.renderMapNodes();
            },

            renderMapNodes() {
              const container = document.getElementById('map-nodes-container');
              const svg = document.getElementById('map-road-svg');
              if (!container || !svg) return;

              container.innerHTML = '';
              const total = STAGES.length;
              let completedCount = 0;

              const nodes = [];
              const startY = 100;
              const stepY = 120;

              for (let i = 0; i < total; i++) {
                const xPct = 50 + 28 * Math.sin(i * 1.1);
                const yPx = startY + i * stepY;
                nodes.push({ id: i + 1, x: xPct, y: yPx });
                if (this.stageProgress[i + 1]) completedCount++;
              }

              const progCounter = document.getElementById('map-progress-counter');
              if (progCounter) progCounter.innerText = `المراحل المنجزة: ${completedCount} / ${total}`;

              let pathD = `M ${nodes[0].x * 4.8} ${nodes[0].y}`;
              for (let i = 0; i < nodes.length - 1; i++) {
                const p1 = nodes[i];
                const p2 = nodes[i + 1];
                const midY = (p1.y + p2.y) / 2;
                pathD += ` C ${p1.x * 4.8} ${midY}, ${p2.x * 4.8} ${midY}, ${p2.x * 4.8} ${p2.y}`;
              }

              svg.setAttribute('viewBox', `0 0 480 ${startY + total * stepY + 60}`);
              svg.innerHTML = `
                <path d="${pathD}" fill="none" stroke="#FFA000" stroke-width="26" stroke-linecap="round"/>
                <path d="${pathD}" fill="none" stroke="#FFF9C4" stroke-width="18" stroke-linecap="round"/>
                <path d="${pathD}" fill="none" stroke="#FF8F00" stroke-width="3" stroke-dasharray="6 6"/>
              `;

              nodes.forEach((n, idx) => {
                const prog = this.stageProgress[n.id];
                const isCompleted = !!prog;
                const isCurrent = (idx === this.currentStageIdx);
                const isLocked = (!isCompleted && idx > this.currentStageIdx);

                const nodeDiv = document.createElement('div');
                nodeDiv.className = `map-node ${isCompleted ? 'completed' : isCurrent ? 'current' : 'locked'}`;
                nodeDiv.style.left = `${n.x}%`;
                nodeDiv.style.top = `${n.y}px`;

                let starsHtml = isCompleted ? '⭐'.repeat(prog.stars) : '';
                let tagHtml = isCurrent ? `<div class="map-current-pin">أنت هنا 🎯</div>` : '';
                let contentHtml = isLocked ? '🔒' : n.id;

                nodeDiv.innerHTML = `${tagHtml}<span>${contentHtml}</span><div class="map-node-stars">${starsHtml}</div>`;

                nodeDiv.onclick = () => {
                  if (isLocked) {
                    AudioEngine.playError();
                    Game.showToast("⚠️ أكمل المرحلة السابقة أولاً لفتح هذه المرحلة!", "#C62828");
                    nodeDiv.classList.add('shake');
                    setTimeout(() => nodeDiv.classList.remove('shake'), 400);
                  } else {
                    Game.openLevelPreview(idx);
                  }
                };

                container.appendChild(nodeDiv);
              });
            },

            openLevelPreview(idx) {
              AudioEngine.playWoodClick();
              this.selectedPreviewIdx = idx;
              const stage = STAGES[idx];
              const prog = this.stageProgress[stage.id];

              document.getElementById('preview-category').innerText = stage.category;
              document.getElementById('preview-title').innerText = `المرحلة ${stage.id}: ${stage.title}`;
              document.getElementById('preview-clue').innerText = `💡 إشارة: ${stage.clue}`;

              const starsBox = document.getElementById('preview-stars');
              if (prog) {
                starsBox.innerHTML = '⭐'.repeat(prog.stars) + ' <span style="font-weight:800; color:#2E7D32;">(مكتملة)</span>';
              } else {
                starsBox.innerHTML = '<span style="font-weight:800; color:#E65100;">🎯 غير مكتملة بعد</span>';
              }

              this.openModal('level-preview-modal');
            },

            startSelectedStage() {
              this.closeModal('level-preview-modal');
              this.loadStage(this.selectedPreviewIdx);
              this.showScreen('game-screen');
            },

            loadStage(idx) {
              if (idx >= STAGES.length) {
                this.openModal('finale-modal');
                return;
              }
              this.currentStageIdx = idx;
              this.saveState();
              const stage = STAGES[idx];

              document.getElementById('game-stage-title').innerText = `مرحلة ${stage.id}`;
              document.getElementById('game-category-tag').innerText = stage.category;
              document.getElementById('game-question-clue').innerText = `💡 ${stage.clue}`;

              const qEl = document.getElementById('game-question-text');
              if (stage.id === 11) {
                qEl.innerHTML = `أين تقع <span id="trick-word" class="trick-clickable" onclick="Game.onTrickClick(event)">'الكعبة المشرفة'</span>؟`;
              } else {
                qEl.innerText = stage.title;
              }

              const svgEl = document.getElementById('stage-svg');
              svgEl.innerHTML = stage.svg;

              if (stage.id === 13) this.renderFacesGrid();
              if (stage.id === 14) this.renderLocksGrid();

              const pin = document.getElementById('target-pin');
              pin.classList.remove('dropped');
              document.getElementById('radar-hint').style.display = 'none';

              this.updateCoinsUI();
            },

            renderFacesGrid() {
              const parent = document.getElementById('faces-grid');
              if (!parent) return;
              let markup = '';
              for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 5; c++) {
                  const cx = 100 + c * 100;
                  const cy = 110 + r * 90;
                  const isSmiling = (r === 2 && c === 3);
                  if (isSmiling) {
                    markup += `
                      <circle cx="${cx}" cy="${cy}" r="32" fill="#FFEB3B" stroke="#F57F17" stroke-width="3"/>
                      <circle cx="${cx - 10}" cy="${cy - 8}" r="4" fill="#212121"/>
                      <circle cx="${cx + 10}" cy="${cy - 8}" r="4" fill="#212121"/>
                      <path d="M ${cx - 16} ${cy + 4} Q ${cx} ${cy + 24}, ${cx + 16} ${cy + 4}" stroke="#D84315" stroke-width="4" fill="none" stroke-linecap="round"/>
                    `;
                  } else {
                    markup += `
                      <circle cx="${cx}" cy="${cy}" r="32" fill="#FFD54F" stroke="#FFA000" stroke-width="2"/>
                      <circle cx="${cx - 10}" cy="${cy - 6}" r="3.5" fill="#212121"/>
                      <circle cx="${cx + 10}" cy="${cy - 6}" r="3.5" fill="#212121"/>
                      <path d="M ${cx - 14} ${cy + 14} Q ${cx} ${cy + 2}, ${cx + 14} ${cy + 14}" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>
                    `;
                  }
                }
              }
              parent.innerHTML = markup;
            },

            renderLocksGrid() {
              const parent = document.getElementById('locks-grid');
              if (!parent) return;
              let markup = '';
              for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                  const cx = 120 + c * 120;
                  const cy = 130 + r * 105;
                  const isOpen = (r === 1 && c === 2);
                  if (isOpen) {
                    markup += `
                      <g transform="translate(${cx - 25}, ${cy - 30})">
                        <path d="M 12 12 Q 12 -18, 35 -18 Q 48 -18, 48 -6" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
                        <rect x="0" y="10" width="50" height="42" rx="8" fill="#FFC107" stroke="#FFA000" stroke-width="3"/>
                        <circle cx="25" cy="28" r="4" fill="#37474F"/>
                      </g>
                    `;
                  } else {
                    markup += `
                      <g transform="translate(${cx - 25}, ${cy - 20})">
                        <path d="M 10 10 Q 25 -15, 40 10" fill="none" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
                        <rect x="0" y="8" width="50" height="42" rx="8" fill="#FFB300" stroke="#FF8F00" stroke-width="3"/>
                        <circle cx="25" cy="26" r="4" fill="#37474F"/>
                      </g>
                    `;
                  }
                }
              }
              parent.innerHTML = markup;
            },

            bindArenaTouch() {
              const arena = document.getElementById('canvas-arena');

              const handlePointer = (e) => {
                e.preventDefault();
                const rect = arena.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const px = clientX - rect.left;
                const py = clientY - rect.top;

                const svgX = (px / rect.width) * 600;
                const svgY = (py / rect.height) * 500;

                const pin = document.getElementById('target-pin');
                pin.style.left = px + 'px';
                pin.style.top = py + 'px';
                pin.classList.remove('dropped');
                void pin.offsetWidth;
                pin.classList.add('dropped');

                AudioEngine.playPinDrop();
                this.evaluateTarget(svgX, svgY, clientX, clientY);
              };

              arena.addEventListener('click', handlePointer);
              arena.addEventListener('touchstart', handlePointer, { passive: false });
            },

            onTrickClick(e) {
              e.stopPropagation();
              AudioEngine.playBullseyeFanfare();
              this.vibrate([100, 50, 100]);
              Confetti.burst(window.innerWidth / 2, 100);
              this.showEvaluationModal(100, "عبقرية خارج الصندوق! 🎯", 3);
            },

            evaluateTarget(x, y, scrX, scrY) {
              const stage = STAGES[this.currentStageIdx];
              const target = stage.target;
              const dist = Math.hypot(x - target.x, y - target.y);

              if (dist <= target.r * 0.5) {
                AudioEngine.playBullseyeFanfare();
                this.vibrate([80, 50, 120]);
                Confetti.burst(scrX, scrY);
                this.showToast("🎯 ضربة معلّم! 100%", "#2E7D32");
                setTimeout(() => this.showEvaluationModal(100, "🎯 ضربة معلّم! إصابة في الصميم!", 3), 600);
              }
              else if (dist <= target.r * 1.0) {
                AudioEngine.playBullseyeFanfare();
                this.vibrate(60);
                Confetti.burst(scrX, scrY);
                this.showToast("⭐ ممتاز! قريب جداً من المركز", "#1565C0");
                setTimeout(() => this.showEvaluationModal(80, "⭐ ممتاز جداً! أداء رائع!", 2), 600);
              }
              else if (dist <= target.r * 1.5) {
                AudioEngine.playCoinSound();
                this.vibrate(40);
                this.showToast("👍 جيد! إصابة مقبولة", "#F57F17");
                setTimeout(() => this.showEvaluationModal(50, "👍 جيد! نجحت في اجتياز المرحلة", 1), 600);
              }
              else {
                AudioEngine.playError();
                this.vibrate(30);
                const arena = document.getElementById('canvas-arena');
                arena.classList.remove('shake');
                void arena.offsetWidth;
                arena.classList.add('shake');

                let tip = "❌ بارد! حاول مجدداً";
                if (dist < target.r * 2.5) tip = "🔥 دافئ! أنت قريب، دقق أكثر!";
                this.showToast(tip, "#D50000");
              }
            },

            showToast(text, color) {
              const toast = document.getElementById('feedback-toast');
              toast.innerText = text;
              toast.style.background = color || '#D50000';
              toast.classList.add('show');
              clearTimeout(this._toastTimer);
              this._toastTimer = setTimeout(() => {
                toast.classList.remove('show');
              }, 1200);
            },

            showEvaluationModal(score, title, stars) {
              const stage = STAGES[this.currentStageIdx];
              let earnedCoins = (stars === 3) ? 50 : (stars === 2) ? 30 : 15;
              this.coins += earnedCoins;
              this.stageProgress[stage.id] = { stars, score };
              this.saveState();
              this.updateCoinsUI();

              document.getElementById('victory-eval').innerText = title;
              document.getElementById('victory-reward-text').innerText = `كسبت +${earnedCoins} 💰`;

              document.getElementById('trivia-card-title').innerText = stage.triviaTitle;
              document.getElementById('trivia-card-text').innerText = stage.triviaFact;

              for (let s = 1; s <= 3; s++) {
                const el = document.getElementById(`star-${s}`);
                el.className = 'star-icon';
                setTimeout(() => {
                  el.className = `star-icon ${s <= stars ? 'filled' : 'empty'}`;
                }, s * 160);
              }

              this.openModal('victory-modal');
            },

            nextStage() {
              AudioEngine.playWoodClick();
              this.closeModal('victory-modal');
              if (this.currentStageIdx + 1 < STAGES.length) {
                this.loadStage(this.currentStageIdx + 1);
              } else {
                this.openModal('finale-modal');
              }
            },

            useHint() {
              if (this.coins < 25) {
                this.showToast("⚠️ ليس لديك ذهب كافٍ! (يلزم 25)", "#C62828");
                AudioEngine.playError();
                return;
              }
              this.coins -= 25;
              this.saveState();
              this.updateCoinsUI();
              AudioEngine.playHint();

              const stage = STAGES[this.currentStageIdx];
              const target = stage.target;
              const arena = document.getElementById('canvas-arena');
              const rect = arena.getBoundingClientRect();

              const hintEl = document.getElementById('radar-hint');
              const px = (target.x / 600) * rect.width;
              const py = (target.y / 500) * rect.height;

              hintEl.style.left = px + 'px';
              hintEl.style.top = py + 'px';
              hintEl.style.width = '90px';
              hintEl.style.height = '90px';
              hintEl.style.display = 'block';

              this.showToast("💡 تم تضييق دائرة البحث!", "#FF8F00");
            },

            askFriend() {
              AudioEngine.playWoodClick();
              const stage = STAGES[this.currentStageIdx];
              const challengeText = `🎯 ساعدني في حل هذا اللغز في لعبة "ضربة معلم"!\nالمرحلة ${stage.id}: ${stage.title}\n${stage.clue}\nهل يمكنك إصابة الهدف؟`;

              if (navigator.share) {
                navigator.share({
                  title: 'لعبة ضربة معلم',
                  text: challengeText
                }).catch(() => {});
              } else {
                navigator.clipboard?.writeText(challengeText);
                this.showToast("📋 تم نسخ نص اللغز لمشاركته مع أصدقائك!", "#0277BD");
              }
            },

            skipStage() {
              if (this.coins < 50) {
                this.showToast("⚠️ يلزم 50 ذهبة للتخطي!", "#C62828");
                AudioEngine.playError();
                return;
              }
              this.coins -= 50;
              this.saveState();
              this.updateCoinsUI();
              AudioEngine.playWoodClick();
              this.showToast("⏩ تم تخطي المرحلة!", "#6A1B9A");
              setTimeout(() => {
                this.nextStage();
              }, 600);
            },

            claimDailyGift() {
              AudioEngine.playBullseyeFanfare();
              Confetti.burst();
              this.coins += 100;
              this.saveState();
              this.updateCoinsUI();
              this.showToast("🎁 مبروك! كسبت 100 ذهبة مجانية!", "#2E7D32");
            },

            watchAdReward() {
              AudioEngine.playCoinSound();
              Confetti.burst();
              this.coins += 50;
              this.saveState();
              this.updateCoinsUI();
              this.closeModal('coins-modal');
              this.showToast("🎬 شكراً لدعمك! +50 ذهبة", "#2E7D32");
            },

            shareGame() {
              AudioEngine.playCoinSound();
              this.coins += 100;
              this.saveState();
              this.updateCoinsUI();
              this.showToast("🌟 شكراً لمشاركتك! +100 ذهبة", "#2E7D32");
              if (navigator.share) {
                navigator.share({
                  title: 'ضربة معلم',
                  text: 'العب لعبة الألغاز والمعلومات العربية المميزة "ضربة معلم"!'
                }).catch(() => {});
              }
            },

            updateCoinsUI() {
              const ids = ['menu-coins-val', 'map-coins-val', 'game-coins-val'];
              ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerText = this.coins;
              });
            },

            openSettingsModal() {
              AudioEngine.playWoodClick();
              this.openModal('settings-modal');
            },

            openCoinsModal() {
              AudioEngine.playWoodClick();
              this.openModal('coins-modal');
            },

            openModal(id) {
              const m = document.getElementById(id);
              if (m) m.classList.add('active');
            },

            closeModal(id) {
              AudioEngine.playWoodClick();
              const m = document.getElementById(id);
              if (m) m.classList.remove('active');
            },

            toggleSound(val) {
              AudioEngine.enabled = val;
              this.saveState();
            },

            toggleVibration(val) {
              this.vibrationEnabled = val;
              this.saveState();
            },

            resetGame() {
              if (confirm("هل تريد بالتأكيد إعادة تصفير تقدمك بالكامل في اللعبة؟")) {
                localStorage.clear();
                this.currentStageIdx = 0;
                this.coins = 250;
                this.stageProgress = {};
                this.saveState();
                location.reload();
              }
            }
          };

          window.handleAndroidBack = function() {
            const activeModal = document.querySelector('.modal-overlay.active');
            if (activeModal) {
              Game.closeModal(activeModal.id);
              return "handled";
            }

            if (document.getElementById('game-screen').classList.contains('active')) {
              Game.openMapScreen();
              return "handled";
            }

            if (document.getElementById('map-screen').classList.contains('active')) {
              Game.goToMenu();
              return "handled";
            }

            if (document.getElementById('splash-screen').classList.contains('active')) {
              Game.goToMenu();
              return "handled";
            }

            if (document.getElementById('menu-screen').classList.contains('active')) {
              return "exit";
            }

            Game.goToMenu();
            return "handled";
          };

          window.addEventListener('DOMContentLoaded', () => {
            Game.init();
          });
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Download & Setup Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip
          chmod +x gradle-8.5/bin/gradle
          ./gradle-8.5/bin/gradle -v

      - name: Build Android APK (assembleDebug)
        run: |
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "APK not found!" && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Darbat-Mouallim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
