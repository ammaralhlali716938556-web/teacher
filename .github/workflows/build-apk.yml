          <script>
          const AudioEngine = {
            ctx: null,
            enabled: true,

            init() {
              if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
              }
              if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
              }
            },

            playWoodClick() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(320, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.06);
              gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.06);
            },

            playPinDrop() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(450, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.09);
              gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.09);
            },

            playBullseyeFanfare() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const notes = [523.25, 659.25, 783.99, 1046.50, 1318.5];
              notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + idx * 0.08);
                osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
              });
            },

            playCoinSound() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
              osc.frequency.setValueAtTime(1318.5, this.ctx.currentTime + 0.07);
              gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.25);
            },

            playError() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(160, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.18);
              gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.18);
            },

            playHint() {
              if (!this.enabled) return;
              this.init();
              if (!this.ctx) return;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, this.ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.25);
              gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.25);
            }
          };

          const Confetti = {
            canvas: document.getElementById('confetti-canvas'),
            ctx: null,
            particles: [],
            animating: false,

            init() {
              this.ctx = this.canvas.getContext('2d');
              this.resize();
              window.addEventListener('resize', () => this.resize());
            },

            resize() {
              this.canvas.width = window.innerWidth;
              this.canvas.height = window.innerHeight;
            },

            burst(x, y) {
              this.particles = [];
              const colors = ['#FFD600', '#FF1744', '#00E676', '#00B0FF', '#FF9100', '#FFFFFF'];
              for (let i = 0; i < 70; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 8;
                this.particles.push({
                  x: x || this.canvas.width / 2,
                  y: y || this.canvas.height / 3,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed - 3,
                  size: 5 + Math.random() * 7,
                  color: colors[Math.floor(Math.random() * colors.length)],
                  rotation: Math.random() * 360,
                  rotSpeed: (Math.random() - 0.5) * 10,
                  gravity: 0.25,
                  opacity: 1
                });
              }
              if (!this.animating) {
                this.animating = true;
                this.render();
              }
            },

            render() {
              if (!this.particles.length) {
                this.animating = false;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                return;
              }
              this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
              for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.rotSpeed;
                p.opacity -= 0.012;

                if (p.opacity <= 0 || p.y > this.canvas.height) {
                  this.particles.splice(i, 1);
                  continue;
                }

                this.ctx.save();
                this.ctx.translate(p.x, p.y);
                this.ctx.rotate((p.rotation * Math.PI) / 180);
                this.ctx.globalAlpha = p.opacity;
                this.ctx.fillStyle = p.color;
                this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
                this.ctx.restore();
              }
              requestAnimationFrame(() => this.render());
            }
          };

